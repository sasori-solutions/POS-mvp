name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Replace superseded PR checks, but let production uploads finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Basic checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - run: npm run build
      - name: Save the production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      artifact-name: production-dist
    secrets: inherit
